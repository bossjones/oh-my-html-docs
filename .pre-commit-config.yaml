default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.2
    hooks:
      - id: uv-sync

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Verbatim HTML bundles are served as-authored; don't whitespace-normalise them.
        exclude: ^docs/pages/
      - id: end-of-file-fixer
        exclude: ^docs/pages/
      - id: check-yaml
      - id: check-added-large-files
        # Standalone HTML docs ship with sibling raster assets (PNGs up to ~1.2 MB). Allow them
        # as normal git objects; the 9.9 MB cmux PDF is excluded from import instead.
        args: ["--maxkb=2048"]
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: check-executables-have-shebangs
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.0.166 # Use the latest release tag
    hooks:
      - id: rumdl
        # Lint authored markdown (cards + landing pages + README + specs); mirrors .rumdl.toml `include`.
        # Verbatim HTML bundles under docs/pages/ are not markdown and are excluded.
        files: ^(README\.md|docs/.*\.md|specs/.*\.md)$
